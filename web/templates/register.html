{% extends "base.html" %}

{% block title %}Register - Drown Platform{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 80px auto; padding: 32px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;">
    <h1 style="font-size: 28px; font-weight: 600; margin-bottom: 8px; color: #E6EDF3;">Create Account</h1>
    <p style="color: #8B949E; margin-bottom: 32px;">Join the Drown Platform</p>

    {% if errors %}
    <div style="background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.3); border-radius: 8px; padding: 12px 16px; margin-bottom: 24px;">
        {% for error in errors %}
        <div style="color: #F85149; font-size: 14px;">{{ error }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
        <div style="margin-bottom: 20px;">
            <label for="username" style="display: block; font-weight: 500; margin-bottom: 8px; color: #E6EDF3;">Username</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                value="{{ username or '' }}"
                required
                style="
                    width: 100%;
                    padding: 10px 14px;
                    background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(255,255,255,0.15);
                    border-radius: 6px;
                    color: #E6EDF3;
                    font-size: 14px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; font-weight: 500; margin-bottom: 8px; color: #E6EDF3;">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                required
                style="
                    width: 100%;
                    padding: 10px 14px;
                    background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(255,255,255,0.15);
                    border-radius: 6px;
                    color: #E6EDF3;
                    font-size: 14px;
                    box-sizing: border-box;
                "
            >
        </div>

        <div style="margin-bottom: 24px;">
            <label for="confirm_password" style="display: block; font-weight: 500; margin-bottom: 8px; color: #E6EDF3;">Confirm Password</label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                required
                style="
                    width: 100%;
                    padding: 10px 14px;
                    background: rgba(255,255,255,0.05);
                    border: 1px solid rgba(255,255,255,0.15);
                    border-radius: 6px;
                    color: #E6EDF3;
                    font-size: 14px;
                    box-sizing: border-box;
                "
            >
        </div>

        <button 
            type="submit"
            style="
                width: 100%;
                padding: 12px;
                background: #58A6FF;
                border: none;
                border-radius: 6px;
                color: #0A0E14;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: background 0.2s;
            "
            onmouseover="this.style.background='#6CB6FF'"
            onmouseout="this.style.background='#58A6FF'"
        >
            Create Account
        </button>
    </form>

    <div style="margin-top: 24px; text-align: center; color: #8B949E; font-size: 14px;">
        Already have an account?
        <a href="{{ url_for('login') }}" style="color: #58A6FF; text-decoration: none; font-weight: 500;">
            Log in
        </a>
    </div>
</div>
{% endblock %}

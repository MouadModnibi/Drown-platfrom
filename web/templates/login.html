<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Drown Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Apply theme before paint to prevent flash -->
    <script>
        (function(){try{var t=localStorage.getItem('drown-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Drown Platform</h1>
            <p class="auth-subtitle">Sign in to your account</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        value="{{ username or '' }}"
                        required
                        autofocus
                        class="form-input"
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="form-input"
                        autocomplete="current-password"
                    />
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Sign In
                </button>
            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Register here</a>
            </p>
        </div>
    </div>
    <button class="theme-toggle theme-toggle-fixed" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
        <span class="theme-icon theme-icon-dark">🌙</span>
        <span class="theme-icon theme-icon-light">☀️</span>
    </button>
    <script src="{{ url_for('static', filename='js/ocean.js') }}"></script>
</body>
</html>

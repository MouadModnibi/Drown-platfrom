<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Drown Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">Drown Platform</h1>
            <nav class="nav">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Apps</a>
                <a href="{{ url_for('platform_metrics') }}" class="nav-link {% if request.endpoint == 'platform_metrics' %}active{% endif %}">Metrics</a>
                {% if current_user %}
                <span class="nav-separator">|</span>
                <span class="nav-username">{{ current_user.username }}</span>
                <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>

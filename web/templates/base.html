<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Drown Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
    <!-- Apply theme before paint to prevent flash -->
    <script>
        (function(){try{var t=localStorage.getItem('drown-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="{{ url_for('index') }}" class="logo-link">
                <h1 class="logo">Drown Platform</h1>
            </a>
            <nav class="nav">
                {% if current_user %}
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Apps</a>
                <a href="{{ url_for('platform_metrics') }}" class="nav-link {% if request.endpoint == 'platform_metrics' %}active{% endif %}">Metrics</a>
                <a href="{{ url_for('help_page') }}" class="nav-link {% if request.endpoint == 'help_page' %}active{% endif %}">Help</a>
                {% if is_admin %}
                <a href="{{ url_for('admin_dashboard') }}" class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">Admin</a>
                {% endif %}
                <span class="nav-separator">|</span>
                <a href="{{ url_for('profile') }}" class="nav-link nav-username {% if request.endpoint == 'profile' %}active{% endif %}" title="Profile & Settings">{{ current_user.username }}</a>
                <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
                {% endif %}
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
                    <span class="theme-icon theme-icon-dark">🌙</span>
                    <span class="theme-icon theme-icon-light">☀️</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/ocean.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Drown Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Drown Platform</h1>
            <p class="auth-subtitle">Create your account</p>
            
            {% if errors %}
            <div class="alert alert-error">
                <ul style="margin: 0; padding-left: 1.25rem;">
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        value="{{ username or '' }}"
                        required 
                        autofocus
                        minlength="3"
                        class="form-input"
                    />
                    <span class="form-hint">At least 3 characters</span>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="6"
                        class="form-input"
                    />
                    <span class="form-hint">At least 6 characters</span>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required
                        minlength="6"
                        class="form-input"
                    />
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Create Account
                </button>
            </form>
            
            <p class="auth-footer">
                Already have an account? 
                <a href="{{ url_for('login') }}">Sign in here</a>
            </p>
        </div>
    </div>
</body>
</html>
